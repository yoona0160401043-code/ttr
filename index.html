<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supermarket Game Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF4E6; --card:#ffffff; --ink:#3a2e2a; --muted:#8a7a70;
  --pink:#E8607A; --pinkSoft:#FDE3E8; --green:#5BAF6A; --greenSoft:#E2F3E4;
  --yellow:#F6C343; --yellowSoft:#FFF4CF; --blue:#4A90D9; --blueSoft:#E1EEFB;
  --teamA:#E8607A; --teamB:#4A90D9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Fredoka',system-ui,sans-serif;background:var(--cream);color:var(--ink);
  background-image:radial-gradient(circle at 8% 10%, #fde3e8 0 60px, transparent 61px),radial-gradient(circle at 95% 90%, #e2f3e4 0 90px, transparent 91px);
  min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none}
/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-bottom:3px solid #f1e4cc;flex-wrap:wrap}
.brand{font-weight:700;font-size:20px;color:var(--pink);display:flex;align-items:center;gap:8px;cursor:pointer}
.brand img{height:34px}
.score{display:flex;gap:10px;margin-left:auto;align-items:center;flex-wrap:wrap}
.team{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 14px;border-radius:999px;font-weight:600;font-size:18px;border:3px solid transparent;transition:.25s}
.team.a{background:var(--pinkSoft);color:var(--teamA)}
.team.b{background:var(--blueSoft);color:var(--teamB)}
.team.turn.a{border-color:var(--teamA);box-shadow:0 0 0 4px #e8607a33}
.team.turn.b{border-color:var(--teamB);box-shadow:0 0 0 4px #4a90d933}
.team .pts{font-size:24px;min-width:56px;text-align:center}
.team .mini{width:28px;height:28px;border-radius:50%;background:#fff;color:inherit;font-size:18px;font-weight:700}
.iconbtn{background:#f3ead9;color:var(--ink);border-radius:12px;padding:8px 12px;font-size:15px;font-weight:500}
.bump{animation:bump .5s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
main{flex:1;padding:18px;max-width:1200px;width:100%;margin:0 auto;display:flex;flex-direction:column}
/* menu */
h1{font-size:38px;margin:6px 0 4px;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 0 18px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.gcard{background:#fff;border-radius:22px;padding:16px;box-shadow:0 4px 0 #ecdcc0;text-align:left;display:flex;gap:14px;align-items:center;transition:transform .15s;position:relative}
.gcard:hover{transform:translateY(-3px)}
.gcard img{width:84px;height:84px;object-fit:contain;flex:none}
.gcard .emo{font-size:60px;width:84px;text-align:center;flex:none}
.gcard .n{font-size:13px;font-weight:600;color:#fff;background:var(--pink);border-radius:999px;padding:2px 10px;display:inline-block}
.gcard h3{margin:6px 0 2px;font-size:22px}
.gcard p{margin:0;color:var(--muted);font-size:15px}
.gcard.done::after{content:'✓ played';position:absolute;top:10px;right:12px;font-size:13px;color:var(--green);font-weight:600}
/* game screen */
.ghead{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.tag{background:var(--pink);color:#fff;border-radius:8px;padding:3px 10px;font-weight:600;font-size:14px}
.ghead h2{margin:0;font-size:30px}
.progress{margin-left:auto;color:var(--muted);font-size:17px}
.turnbanner{text-align:center;font-size:22px;font-weight:600;padding:8px;border-radius:14px;margin-bottom:12px}
.turnbanner.a{background:var(--pinkSoft);color:var(--teamA)}
.turnbanner.b{background:var(--blueSoft);color:var(--teamB)}
.turnbanner.both{background:var(--yellowSoft);color:#9a6b00}
.stage{background:#fff;border-radius:26px;padding:22px;box-shadow:0 5px 0 #ecdcc0;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:420px}
.prompt{font-size:34px;font-weight:600;text-align:center;line-height:1.3}
.prompt .blank{display:inline-block;min-width:150px;border-bottom:4px dashed var(--pink);color:var(--pink)}
.big{font-size:130px;line-height:1}
.bigimg{height:190px;object-fit:contain}
.opts{display:grid;gap:14px;width:100%;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{background:var(--yellowSoft);border-radius:18px;padding:16px 14px;font-size:24px;font-weight:600;color:var(--ink);box-shadow:0 4px 0 #ecd99a;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .1s}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.opt img{height:86px;object-fit:contain}
.opt .e{font-size:64px;line-height:1}
.opt.right{background:var(--greenSoft);box-shadow:0 4px 0 #9fd3a7;outline:4px solid var(--green)}
.opt.wrong{background:#f1f1f1;color:#b5b5b5;box-shadow:none;text-decoration:line-through}
.opt.wrong img,.opt.wrong .e{opacity:.3}
.opt:disabled{cursor:default}
.opt.sentence{font-size:22px;text-align:center}
.feedback{width:100%;border-radius:18px;padding:14px 18px;font-size:22px;text-align:center;display:none}
.feedback.show{display:block;animation:pop .35s}
.feedback.good{background:var(--greenSoft);color:#2f7a3c}
.feedback.bad{background:var(--yellowSoft);color:#8a5d00}
.feedback .say{display:block;font-size:26px;font-weight:600;color:var(--ink);margin-top:6px}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{background:var(--pink);color:#fff;border-radius:16px;padding:12px 24px;font-size:20px;font-weight:600;box-shadow:0 4px 0 #c24760}
.btn.green{background:var(--green);box-shadow:0 4px 0 #3f8a4c}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 #2f6eaf}
.btn.ghost{background:#f3ead9;color:var(--ink);box-shadow:0 4px 0 #ddcfb4}
.btn:disabled{opacity:.4;cursor:default}
.hint{color:var(--muted);font-size:17px;text-align:center}
/* shop game */
.shop{display:grid;grid-template-columns:1fr 300px;gap:18px;width:100%}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.item{background:var(--cream);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:17px;font-weight:500;box-shadow:0 3px 0 #ecdcc0;position:relative}
.item img{height:70px;object-fit:contain}
.item .e{font-size:52px;line-height:1.2}
.price{background:var(--yellow);color:var(--ink);border-radius:8px;padding:0 8px;font-weight:700}
.item .cnt{position:absolute;top:6px;right:8px;background:var(--pink);color:#fff;border-radius:50%;width:26px;height:26px;font-weight:700;display:none;align-items:center;justify-content:center}
.basket{background:var(--blueSoft);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.basket h4{margin:0;font-size:20px;display:flex;align-items:center;gap:8px}
.basket h4 img{height:36px}
.blist{flex:1;font-size:17px;min-height:80px}
.blist div{display:flex;justify-content:space-between}
.total{font-size:26px;font-weight:700;border-top:2px dashed #a9c7ea;padding-top:6px;display:flex;justify-content:space-between}
.mission{background:var(--yellowSoft);border-radius:16px;padding:12px 18px;font-size:24px;font-weight:600;text-align:center;width:100%}
/* flash */
.flashbox{width:320px;height:260px;border-radius:24px;background:var(--cream);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.flashbox .cover{position:absolute;inset:0;background:repeating-linear-gradient(45deg,#E8607A,#E8607A 18px,#ee7b91 18px,#ee7b91 36px);display:flex;align-items:center;justify-content:center;color:#fff;font-size:80px;font-weight:700;transition:clip-path .15s}
.timer{font-size:56px;font-weight:700;color:var(--pink)}
.answerword{font-size:44px;font-weight:700;color:var(--green);min-height:56px}
/* story */
.story{background:var(--cream);border-radius:18px;padding:16px 20px;font-size:20px;line-height:1.55;max-width:900px}
/* end */
.trophy{font-size:120px;line-height:1}
.final{display:flex;gap:30px;justify-content:center;flex-wrap:wrap}
.final .fs{border-radius:22px;padding:18px 34px;text-align:center;font-size:24px;font-weight:600}
.final .fs b{display:block;font-size:64px}
.confetti{position:fixed;top:-20px;font-size:28px;pointer-events:none;animation:fall linear forwards;z-index:50}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.small{font-size:14px;color:var(--muted)}
.help{background:#fff;border-radius:18px;padding:16px 20px;margin-top:18px;font-size:16px;color:var(--muted);line-height:1.6}
.help b{color:var(--ink)}
@media (max-width:760px){.shop{grid-template-columns:1fr}.prompt{font-size:26px}.big{font-size:96px}h1{font-size:30px}}
</style>
</head>
<body>
<div class="top">
  <div class="brand" id="home"><img alt="" id="logoImg">Supermarket Game Show</div>
  <div class="score">
    <div class="team a" id="tA"><span>Team A ★</span><span class="pts" id="sA">0</span><button class="mini" data-t="A" data-d="-1" title="minus 1">−</button><button class="mini" data-t="A" data-d="1" title="plus 1">+</button></div>
    <div class="team b" id="tB"><span>Team B ★</span><span class="pts" id="sB">0</span><button class="mini" data-t="B" data-d="-1" title="minus 1">−</button><button class="mini" data-t="B" data-d="1" title="plus 1">+</button></div>
    <button class="iconbtn" id="soundBtn">🔊 Sound</button>
    <button class="iconbtn" id="fsBtn">⛶ Full screen</button>
  </div>
</div>
<main id="app"></main>

/* ---------- sound ---------- */
let ac;
function tone(freqs, dur=0.12, type='sine'){
  if(!S.sound) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    let t = ac.currentTime;
    freqs.forEach(f=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type; o.frequency.value=f; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.start(t); o.stop(t+dur); t+=dur*0.85;
    });
  }catch(e){}
}
const sfx = {
  good:()=>tone([660,880,1100],.13,'triangle'),
  bad:()=>tone([300,220],.18,'sawtooth'),
  click:()=>tone([520],.06),
  win:()=>tone([523,659,784,1046,784,1046],.16,'triangle'),
  tick:()=>tone([900],.05,'square')
};

/* ---------- scoring ---------- */
function renderScore(){
  $('#sA').textContent=S.A; $('#sB').textContent=S.B;
  $('#tA').classList.toggle('turn', S.turn==='A');
  $('#tB').classList.toggle('turn', S.turn==='B');
}
function addStar(t, n=1){
  S[t]=Math.max(0,S[t]+n); renderScore();
  const el = $('#s'+t); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}
document.querySelectorAll('.mini').forEach(b=>b.onclick=e=>{e.stopPropagation(); addStar(b.dataset.t, +b.dataset.d); sfx.click();});

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function confetti(){
  const em=['⭐','🍎','🍌','🥕','🧃','🍪','🎉'];
  for(let i=0;i<40;i++){
    const d=document.createElement('div'); d.className='confetti';
    d.textContent=em[i%em.length]; d.style.left=Math.random()*100+'vw';
    d.style.animationDuration=(2+Math.random()*2)+'s'; d.style.animationDelay=Math.random()*.8+'s';
    document.body.appendChild(d); setTimeout(()=>d.remove(),5000);
  }
}

const STORY = "On Saturday, Ben went to the supermarket with Mum. First, they went to the fruit section. Ben chose a bag of apples for eight dollars and a bunch of bananas for five dollars. Then Mum bought a bottle of milk for ten dollars and a box of cereal for ten dollars, too. At the checkout, the cashier said, “That's thirty-three dollars, please.” Mum paid. Ben said, “Thank you!”";
const TF = [
  {s:'Ben went to the supermarket on Sunday.', a:false, fix:'Ben went to the supermarket on Saturday.'},
  {s:'Ben went shopping with Mum.', a:true, fix:'He went with Mum.'},
  {s:'Ben chose a bag of oranges.', a:false, fix:'Ben chose a bag of apples.'},
  {s:'The bananas were five dollars.', a:true, fix:'The bananas were five dollars.'},
  {s:'Mum bought a bottle of water.', a:false, fix:'Mum bought a bottle of milk.'},
  {s:'The shopping was thirty-three dollars.', a:true, fix:"That's thirty-three dollars."},
  {s:'Ben said “Thank you!” at the checkout.', a:true, fix:'Ben said, “Thank you!”'}
];
const FLASH = [
  {img:'apples',w:'a bag of apples'},{emoji:'🥦',w:'broccoli'},{img:'yogurt',w:'a cup of yogurt'},
  {emoji:'🦐',w:'shrimp'},{img:'cereal',w:'a box of cereal'},{emoji:'🍇',w:'grapes'},
  {img:'water',w:'a bottle of water'},{emoji:'🍪',w:'cookies'},{emoji:'🥒',w:'cucumber'},
  {img:'oj',w:'orange juice'},{emoji:'🥩',w:'beef'},{img:'cashier',w:'cashier'}
];

const GAMES = [
  {id:'flash', n:1, title:'Flash & Shout', desc:'A picture peeks out. First team to shout the word wins!', icon:{emoji:'⚡'}, run:gFlash},
  {id:'sort', n:2, title:'Supermarket Sort', desc:'Which section does it go in?', icon:{img:'aisle'}, run:gSort},
  {id:'qty', n:3, title:'Quantity Quest', desc:'a bag of · a bottle of · a box of · a cup of', icon:{img:'cereal'}, run:gQty},
  {id:'polite', n:4, title:'Polite Shopper', desc:'Pick the best thing to say — then act it out!', icon:{img:'boy'}, run:gPolite},
  {id:'riddle', n:5, title:'Taste Riddles', desc:'Sweet? Sour? Crunchy? Juicy? Guess the food!', icon:{emoji:'🍋'}, run:gRiddle},
  {id:'shop', n:6, title:'Shopping Challenge', desc:'Fill the basket and do the money maths.', icon:{img:'basket'}, run:gShop},
  {id:'story', n:7, title:"Ben's Story: True or False?", desc:'Read the story. Is it true or false?', icon:{img:'cashier'}, run:gStory},
];

/* ---------- menu ---------- */
function menu(){
  S.turn = S.turn || 'A'; renderScore();
  app.innerHTML = `
    <h1>🛒 Supermarket Game Show</h1>
    <p class="sub">Team A vs Team B · Pick a game · Win stars ★</p>
    <div class="grid">
      ${GAMES.map(g=>`<button class="gcard ${S.played.has(g.id)?'done':''}" data-g="${g.id}">
        ${g.icon.img?`<img src="${IMG[g.icon.img]}" alt="">`:`<span class="emo">${g.icon.emoji}</span>`}
        <div><span class="n">GAME ${g.n}</span><h3>${g.title}</h3><p>${g.desc}</p></div></button>`).join('')}
      <button class="gcard" id="finalBtn" style="background:var(--yellowSoft)"><span class="emo">🏆</span>
        <div><span class="n" style="background:var(--green)">FINISH</span><h3>Who Wins?</h3><p>Show the final stars.</p></div></button>
    </div>
    <div class="help"><b>How to play:</b> Teams take turns. Right answer = ★. Wrong answer = the other team can <b>steal</b> it!
    After each answer, the class says the full sentence together — press <b>Bonus ★</b> if the team speaks clearly.
    Use the <b>+ / −</b> buttons on the scoreboard any time. <br><span class="small">Tip: click “Full screen” before you start.</span></div>`;
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{sfx.click(); const g=GAMES.find(x=>x.id===b.dataset.g); S.played.add(g.id); g.run(g);});
  $('#finalBtn').onclick=finale;
}

/* ---------- generic Q&A engine with turn + steal ---------- */
function quiz(game, items, build){
  let i=0;
  const total=items.length;
  function show(){
    if(i>=total) return endRound(game);
    const it=items[i];
    const q=build(it);
    let attempt=S.turn, stealing=false, locked=false;
    app.innerHTML = `
      <div class="ghead"><span class="tag">GAME ${game.n}</span><h2>${game.title}</h2><span class="progress">Question ${i+1} / ${total}</span></div>
      <div class="turnbanner ${attempt.toLowerCase()}" id="tb">Team ${attempt}'s turn!</div>
      <div class="stage">
        ${q.top}
        <div class="opts" ${q.cols?`style="grid-template-columns:repeat(${q.cols},1fr)"`:''}>${q.opts.map((o,k)=>`<button class="opt ${q.optClass||''}" data-k="${k}">${o.html}</button>`).join('')}</div>
        <div class="feedback" id="fb"></div>
        <div class="actions" id="act"></div>
      </div>`;
    renderScore();
    const tb=$('#tb'), fb=$('#fb'), act=$('#act');
    app.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
      if(locked) return;
      const k=+btn.dataset.k, ok=q.opts[k].correct;
      if(ok){
        locked=true; btn.classList.add('right'); sfx.good(); addStar(attempt);
        fb.className='feedback good show';
        fb.innerHTML=`⭐ Team ${attempt} gets a star!${q.say?`<span class="say">Say it together: “${q.say}”</span>`:''}`;
        finishBtns(attempt);
      }else{
        btn.classList.add('wrong'); btn.disabled=true; sfx.bad();
        if(!stealing){
          stealing=true; attempt=other(attempt);
          tb.className='turnbanner '+attempt.toLowerCase(); tb.textContent=`Steal! Team ${attempt}, can you answer?`;
          S.turn=attempt; renderScore();
          fb.className='feedback bad show'; fb.textContent='Not quite! The other team can steal.';
        }else{
          locked=true;
          app.querySelectorAll('.opt').forEach((b,kk)=>{ if(q.opts[kk].correct) b.classList.add('right'); });
          fb.className='feedback bad show';
          fb.innerHTML=`No stars this time. Here's the answer!${q.say?`<span class="say">Say it together: “${q.say}”</span>`:''}`;
          finishBtns(null);
        }
      }
    });
    function finishBtns(winner){
      act.innerHTML = `${winner?`<button class="btn green" id="bonus">Bonus ★ clear speaking</button>`:''}<button class="btn" id="next">Next ➜</button>`;
      if(winner){ const bb=$('#bonus'); bb.onclick=()=>{addStar(winner); sfx.good(); bb.disabled=true; bb.textContent='Bonus given ✓';}; }
      $('#next').onclick=()=>{ sfx.click(); i++; S.turn = (i%2? other(startTeam):startTeam); show(); };
    }
  }
  if(S.turn!=='A'&&S.turn!=='B') S.turn='A';
  const startTeam=S.turn;
  show();
}
function endRound(game){
  sfx.win(); confetti();
  const lead = S.A===S.B ? "It's a tie!" : (S.A>S.B?'Team A is winning!':'Team B is winning!');
  app.innerHTML=`<div class="stage">
    <div class="trophy">🎉</div><div class="prompt">${game.title} — finished!</div>
    <div class="final"><div class="fs" style="background:var(--pinkSoft);color:var(--teamA)">Team A<b>${S.A}</b></div><div class="fs" style="background:var(--blueSoft);color:var(--teamB)">Team B<b>${S.B}</b></div></div>
    <div class="hint">${lead}</div>
    <div class="actions"><button class="btn" id="back">Back to games</button></div></div>`;
  S.turn=other(S.turn); renderScore();
  $('#back').onclick=menu;
}

/* ---------- games ---------- */
function gSort(game){
  quiz(game, shuffle(SORT).slice(0,10), it=>({
    top:`<div class="prompt">Which section?</div>${it.img?`<img class="bigimg" src="${IMG[it.img]}" alt="">`:`<div class="big">${it.emoji}</div>`}<div class="prompt" style="font-size:30px">${it.word}</div>`,
    cols:3,
    opts: SECTIONS.map(s=>({html:`<img src="${IMG[s.img]}" alt="">${s.k}`, correct:s.k===it.a})),
    say:`You can find ${it.word} in the ${it.a.toLowerCase()} section.`
  }));
}
function gQty(game){
  quiz(game, shuffle(QTY).slice(0,7), it=>({
    top:`${it.img?`<img class="bigimg" src="${IMG[it.img]}" alt="">`:`<div class="big">${it.emoji}</div>`}<div class="prompt">${it.s.replace('___','<span class="blank">?</span>')}</div>`,
    opts: QTY_OPTS.map(o=>({html:o, correct:o===it.a})),
    say: it.s.replace('___', it.a)
  }));
}
function gPolite(game){
  quiz(game, shuffle(POLITE).slice(0,6), it=>({
    top:`<img class="bigimg" style="height:150px" src="${IMG[it.sit.startsWith('You are')?'cashier':'boy']}" alt=""><div class="prompt">${it.sit}<br><span style="font-size:24px;color:var(--muted)">What do you say?</span></div>`,
    optClass:'sentence',
    opts: shuffle(it.opts.map((o,k)=>({html:o, correct:k===it.a}))),
    say: it.opts[it.a]+' — now act it out with a partner!'
  }));
}
function gRiddle(game){
  quiz(game, shuffle(RIDDLE).slice(0,6), it=>({
    top:`<div class="big" style="font-size:80px">🕵️</div><div class="prompt">“${it.clue}”<br><span style="font-size:24px;color:var(--muted)">What is it?</span></div>`,
    opts: shuffle(it.opts).map(o=>({html:`${pic(o)}${o.word}`, correct:o.word===it.a})),
    say:`It's ${['grapes','chips','milk','shrimp'].includes(it.a)?'':'a '}${it.a}!`
  }));
}
function gStory(game){
  let i=0; const items=shuffle(TF).slice(0,6); const startTeam=S.turn;
  function show(){
    if(i>=items.length) return endRound(game);
    const it=items[i]; let team=(i%2? other(startTeam):startTeam), locked=false; S.turn=team; renderScore();
    app.innerHTML=`
      <div class="ghead"><span class="tag">GAME ${game.n}</span><h2>${game.title}</h2><span class="progress">Question ${i+1} / ${items.length}</span></div>
      <details ${i===0?'open':''} style="margin-bottom:10px"><summary style="cursor:pointer;font-size:18px;color:var(--pink);font-weight:600">📖 Show / hide the story</summary><div class="story">${STORY}</div></details>
      <div class="turnbanner ${team.toLowerCase()}" id="tb">Team ${team}'s turn!</div>
      <div class="stage">
        <div class="prompt">${it.s}</div>
        <div class="opts" style="max-width:600px"><button class="opt" data-v="1"><span class="e">✅</span>TRUE</button><button class="opt" data-v="0"><span class="e">❌</span>FALSE</button></div>
        <div class="feedback" id="fb"></div><div class="actions" id="act"></div>
      </div>`;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(locked) return; locked=true;
      const ok = (b.dataset.v==='1')===it.a; const fb=$('#fb');
      app.querySelectorAll('.opt').forEach(x=>{ if((x.dataset.v==='1')===it.a) x.classList.add('right'); else x.classList.add('wrong'); });
      if(ok){ sfx.good(); addStar(team); fb.className='feedback good show'; fb.innerHTML=`⭐ Correct! Team ${team} gets a star.<span class="say">${it.a?'Read it: ':'Fix it: '}“${it.fix}”</span>`; }
      else { sfx.bad(); fb.className='feedback bad show'; fb.innerHTML=`Oops! Team ${other(team)} — fix the sentence for a star!<span class="say">“${it.fix}”</span>`; }
      $('#act').innerHTML=`${ok?'':`<button class="btn blue" id="steal">Team ${other(team)} fixed it ★</button>`}<button class="btn" id="next">Next ➜</button>`;
      if(!ok) $('#steal').onclick=e=>{addStar(other(team)); sfx.good(); e.target.disabled=true; e.target.textContent='Star given ✓';};
      $('#next').onclick=()=>{i++; show();};
    });
  }
  show();
}
function gFlash(game){
  let i=0; const items=shuffle(FLASH).slice(0,8);
  function show(){
    if(i>=items.length) return endRound(game);
    const it=items[i]; let pct=100, timer=null, revealed=false;
    S.turn='both';
    $('#tA').classList.remove('turn'); $('#tB').classList.remove('turn');
    app.innerHTML=`
      <div class="ghead"><span class="tag">GAME ${game.n}</span><h2>${game.title}</h2><span class="progress">Picture ${i+1} / ${items.length}</span></div>
      <div class="turnbanner both">Both teams! Put up your hand and shout the English word!</div>
      <div class="stage">
        <div class="flashbox">${it.img?`<img style="height:200px" src="${IMG[it.img]}" alt="">`:`<span style="font-size:150px">${it.emoji}</span>`}<div class="cover" id="cv">?</div></div>
        <div class="answerword" id="aw"></div>
        <div class="actions" id="act"><button class="btn green" id="go">▶ Start peeking</button><button class="btn ghost" id="rev">Show answer</button></div>
      </div>`;
    const cv=$('#cv');
    const cx=20+Math.random()*60, cy=20+Math.random()*60;
    function setClip(){ const r=(100-pct)*0.9; const m=`radial-gradient(circle at ${cx}% ${cy}%, transparent ${r}%, #000 ${r+0.5}%)`; cv.style.webkitMaskImage=m; cv.style.maskImage=m; if(r>4) cv.textContent=''; }
    $('#go').onclick=()=>{
      sfx.click(); $('#go').disabled=true;
      timer=setInterval(()=>{ pct-=3; sfx.tick(); setClip(); if(pct<=0){clearInterval(timer);} },400);
    };
    $('#rev').onclick=reveal;
    function reveal(){
      if(revealed) return; revealed=true; clearInterval(timer); pct=0; setClip(); cv.style.display='none';
      $('#aw').textContent=it.w; sfx.good();
      $('#act').innerHTML=`<button class="btn" style="background:var(--teamA)" id="wa">Team A said it first ★</button><button class="btn blue" id="wb">Team B said it first ★</button><button class="btn ghost" id="nx">Nobody / Next ➜</button>`;
      const go=()=>{i++; show();};
      $('#wa').onclick=()=>{addStar('A'); sfx.good(); setTimeout(go,500);};
      $('#wb').onclick=()=>{addStar('B'); sfx.good(); setTimeout(go,500);};
      $('#nx').onclick=go;
    }
  }
  show();
}
function gShop(game){
  let m=0; const missions=MISSIONS.slice(); const startTeam = S.turn==='both'?'A':S.turn;
  function show(){
    if(m>=missions.length) return endRound(game);
    const team = m%2? other(startTeam):startTeam; S.turn=team; renderScore();
    const ms=missions[m]; const basket={}; let tries=0, locked=false;
    app.innerHTML=`
      <div class="ghead"><span class="tag">GAME ${game.n}</span><h2>${game.title}</h2><span class="progress">Mission ${m+1} / ${missions.length}</span></div>
      <div class="turnbanner ${team.toLowerCase()}" id="tb">Team ${team}: send one shopper to the board!</div>
      <div class="stage" style="justify-content:flex-start">
        <div class="mission">🎯 ${ms.t}</div>
        <div class="shop">
          <div class="shelf">${SHOP_ITEMS.map(it=>`<button class="item" data-id="${it.id}"><span class="cnt"></span>${pic(it)}<span>${it.word.replace(/^a (bag|bottle|box|cup|bunch) of /,'')}</span><span class="price">$${it.p}</span></button>`).join('')}</div>
          <div class="basket"><h4><img src="${IMG.basket}" alt="">My basket</h4><div class="blist" id="bl"><span class="small">Tap food to add it. Tap the basket line to remove.</span></div>
            <div class="total"><span>Total</span><span id="tot">$0</span></div>
            <button class="btn green" id="chk">Checkout ✓</button></div>
        </div>
        <div class="feedback" id="fb"></div><div class="actions" id="act"></div>
        <div class="hint">Shopper says: “Can I have ___, please?” · Cashier says: “It's ___ dollars.”</div>
      </div>`;
    function draw(){
      let tot=0, html='';
      SHOP_ITEMS.forEach(it=>{ const c=basket[it.id]||0; tot+=c*it.p;
        const el=app.querySelector(`.item[data-id="${it.id}"] .cnt`); el.style.display=c?'flex':'none'; el.textContent=c;
        if(c) html+=`<div data-rm="${it.id}" style="cursor:pointer">${c} × ${it.word.replace(/^a /,'')}<span>$${c*it.p}</span></div>`; });
      $('#bl').innerHTML = html || '<span class="small">Tap food to add it. Tap the basket line to remove.</span>';
      $('#tot').textContent='$'+tot;
      app.querySelectorAll('[data-rm]').forEach(d=>d.onclick=()=>{ if(locked) return; basket[d.dataset.rm]--; sfx.click(); draw(); });
      return tot;
    }
    app.querySelectorAll('.item').forEach(b=>b.onclick=()=>{ if(locked) return; basket[b.dataset.id]=(basket[b.dataset.id]||0)+1; sfx.click(); draw(); });
    $('#chk').onclick=()=>{
      if(locked) return;
      const tot=draw(); const fb=$('#fb');
      if(ms.check(basket,tot)){
        locked=true; sfx.good(); addStar(team);
        fb.className='feedback good show';
        fb.innerHTML=`⭐ Great shopping, Team ${team}! Total: $${tot}.<span class="say">Cashier: “It's ${numWord(tot)} dollars.” · Shopper: “Here you are.”</span>`;
        $('#act').innerHTML=`<button class="btn green" id="bonus">Bonus ★ role-play done</button><button class="btn" id="next">Next mission ➜</button>`;
        $('#bonus').onclick=e=>{addStar(team); sfx.good(); e.target.disabled=true; e.target.textContent='Bonus given ✓';};
        $('#next').onclick=()=>{m++; show();};
      }else{
        tries++; sfx.bad();
        if(tries===1){
          fb.className='feedback bad show'; fb.textContent=`Hmm, check the mission again! Total is $${tot}. One more try, Team ${team}!`;
        }else{
          const o=other(team);
          fb.className='feedback bad show'; fb.innerHTML=`Steal time! Team ${o}, help them fix the basket.<span class="say">${ms.ex}</span>`;
          $('#tb').className='turnbanner '+o.toLowerCase(); $('#tb').textContent=`Team ${o} can steal!`;
          locked=true;
          $('#act').innerHTML=`<button class="btn blue" id="st">Team ${o} solved it ★</button><button class="btn" id="next">Next mission ➜</button>`;
          $('#st').onclick=e=>{addStar(o); sfx.good(); e.target.disabled=true; e.target.textContent='Star given ✓';};
          $('#next').onclick=()=>{m++; show();};
        }
      }
    };
    draw();
  }
  show();
}
function numWord(n){
  const ones=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tens=['','','twenty','thirty','forty','fifty'];
  if(n<20) return ones[n]; return tens[Math.floor(n/10)]+(n%10?'-'+ones[n%10]:'');
}
function finale(){
  sfx.win(); confetti(); setTimeout(confetti,900);
  const w = S.A===S.B ? "It's a tie — everyone wins!" : `Team ${S.A>S.B?'A':'B'} wins!`;
  app.innerHTML=`<div class="stage">
    <div class="trophy">🏆</div><div class="prompt" style="font-size:44px">${w}</div>
    <div class="final"><div class="fs" style="background:var(--pinkSoft);color:var(--teamA)">Team A<b>${S.A} ★</b></div><div class="fs" style="background:var(--blueSoft);color:var(--teamB)">Team B<b>${S.B} ★</b></div></div>
    <div class="hint">Exit ticket: Say one shopping sentence to your teacher at the door!</div>
    <div class="actions"><button class="btn ghost" id="back">Back to games</button><button class="btn" id="reset">New class (reset stars)</button></div></div>`;
  $('#back').onclick=menu;
  $('#reset').onclick=()=>{S.A=0;S.B=0;S.turn='A';S.played.clear();menu();};
}

menu();
</script>
